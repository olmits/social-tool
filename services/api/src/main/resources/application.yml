spring:
  application:
    name: social-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  # spring.security.oauth2.client.registration entries are added here once the
  # Reddit OAuth2 flow lands (PLAN.md Phase 2). An empty `registration: {}` map
  # breaks Boot's property binding, so the key is omitted until then.

social-api:
  security:
    # Shared key trusted service callers (admin panel backend, Go workers) send as
    # X-API-Key. Injected as an env var; in prod that env var is populated from
    # Secrets Manager via the ECS task definition.
    api-key: ${API_KEY}
  aws:
    region: ${AWS_REGION:us-east-1}
  claude:
    # Blank default, unlike social-api.security.api-key above: a required property with no
    # default fails context refresh for every @SpringBootTest that does not register it, and
    # drafting is the only thing in the service that needs this key. With none configured the
    # generate endpoint answers 502 and nothing else is affected.
    api-key: ${CLAUDE_API_KEY:}
    model: ${CLAUDE_MODEL:claude-opus-5}
    # Let the model read the article behind a signal's URL instead of drafting from the
    # headline. Costs the article's tokens and several seconds; turn off if that stops paying.
    fetch-article: ${CLAUDE_FETCH_ARTICLE:true}
    # The SDK's own default scales to ten minutes, which would hang the panel's dialog.
    timeout-seconds: ${CLAUDE_TIMEOUT_SECONDS:90}
  bluesky:
    # PDS host for AT Protocol / XRPC calls. Defaults to the main Bluesky PDS; override for a
    # self-hosted PDS or a test double.
    base-url: ${BLUESKY_BASE_URL:https://bsky.social}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.omits.social_api: DEBUG
